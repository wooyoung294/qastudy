name: Playwright E2E on PR

on:
  pull_request:
    branches: [ master ]   # 네 기본 브랜치에 맞게 수정

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout qastudy repo
        uses: actions/checkout@v4

      - name: Checkout Study tests repo
        uses: actions/checkout@v4
        with:
          repository: wooyoung294/Study
          path: study-tests
          token: ${{ secrets.STUDY_REPO_TOKEN }}  # 아까 만든 토큰

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: study-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run Playwright tests
        working-directory: study-tests
        env:
          BASE_URL: https://blue-ground-0e078e000.3.azurestaticapps.net
        run: |
          pytest
